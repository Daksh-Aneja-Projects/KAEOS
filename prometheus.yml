global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (mounted from prometheus/alerts.yml by docker-compose.yml).
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'kaeos_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8001']
