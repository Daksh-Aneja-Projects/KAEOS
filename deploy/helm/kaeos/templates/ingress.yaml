{{- if .Values.ingress.enabled }}
{{- $full := include "kaeos.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels: {{- include "kaeos.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API + WS + health route to the backend...
          {{- range .Values.ingress.apiPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-backend
                port:
                  number: {{ $.Values.service.backendPort }}
          {{- end }}
          # ...everything else is the SPA.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
{{- end }}
