apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kaeos.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "kaeos.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run migrations BEFORE the app pods roll, on every install and upgrade, so
    # the N gunicorn replicas never race on DDL. Migrations run as the OWNER role
    # (RLS-bypassing); the app pods run as the non-owner role.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {{- include "kaeos.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "kaeos.image" (list . .Values.backend "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Alembic connects on the owner URL (DDL + RLS policy creation).
          command: ["sh", "-c", "DATABASE_URL=\"$KAEOS_OWNER_DB_URL\" alembic upgrade head"]
          envFrom:
            - secretRef:
                name: {{ include "kaeos.secretName" . }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.backend.env.ENVIRONMENT | default "production" | quote }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
