{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaeos.secretName" . }}
  labels: {{- include "kaeos.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.externalDatabase.appUrl | quote }}
  KAEOS_OWNER_DB_URL: {{ .Values.externalDatabase.ownerUrl | quote }}
  REDIS_URL: {{ .Values.externalRedis.url | quote }}
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.ADMIN_EMAIL | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.ADMIN_PASSWORD | quote }}
  ADMIN_SECRET: {{ .Values.secrets.ADMIN_SECRET | quote }}
  {{- with .Values.secrets.PUBLIC_BASE_URL }}
  PUBLIC_BASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
