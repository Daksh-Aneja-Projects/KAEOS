# KAEOS Helm values. Managed Postgres (with pgvector) and Redis are expected to
# be provided out of cluster - a hand-rolled StatefulSet is not a production
# datastore. Point `externalDatabase` / `externalRedis` at your managed
# services, or a Bitnami subchart if you insist on in-cluster data.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  # Set these to your pushed images (CI builds backend/ and frontend/).
  repository: daksh-aneja-projects/kaeos
  pullPolicy: IfNotPresent
  # Overridden per component below; falls back to Chart.appVersion.
  tag: ""

imagePullSecrets: []

backend:
  image:
    repository: ""          # defaults to {image.repository}-backend
    tag: ""                 # defaults to image.tag or Chart.appVersion
  replicaCount: 2
  # start-prod.sh migrates then runs gunicorn; in k8s the migration Job (a Helm
  # hook) owns migrations, so app pods run gunicorn directly and never race.
  # -c gunicorn.conf.py wires Prometheus multiprocess aggregation across the 4
  # workers (resets the mmap dir on boot, marks dead workers).
  command: ["gunicorn", "app.main:app", "-c", "gunicorn.conf.py", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8001"]
  containerPort: 8001
  env:
    ENVIRONMENT: production
    GUNICORN_WORKERS: "4"
    # Observability: shared dir so /metrics aggregates all 4 workers (writable
    # tmpfs; readOnlyRootFilesystem is false). EXPOSE_METRICS publishes /metrics
    # for the Prometheus scrape. Set OTEL_EXPORTER_OTLP_ENDPOINT to enable traces.
    PROMETHEUS_MULTIPROC_DIR: "/tmp/kaeos-metrics"
    EXPOSE_METRICS: "true"
  # Annotation-based Prometheus scrape discovery (works with the standard
  # kubernetes_sd pod relabel config). Deliberately NOT a ServiceMonitor:
  # that would make the chart depend on the prometheus-operator CRDs.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
    prometheus.io/path: "/metrics"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  # Liveness = is the PROCESS alive (/health/live, always 200). Readiness =
  # process up AND the primary datastore reachable (/health, 503 on DB loss).
  # Liveness must NOT hit /health: a transient DB blip would 503 every pod and
  # k8s would restart-storm all containers exactly while the DB is recovering.
  livenessProbe:
    httpGet: { path: /health/live, port: 8001 }
    initialDelaySeconds: 20
    periodSeconds: 20
  readinessProbe:
    httpGet: { path: /health, port: 8001 }
    initialDelaySeconds: 10
    periodSeconds: 10

frontend:
  image:
    repository: ""          # defaults to {image.repository}-frontend
    tag: ""
  replicaCount: 2
  containerPort: 80
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "250m", memory: "128Mi" }
  livenessProbe:
    httpGet: { path: /, port: 80 }
    initialDelaySeconds: 5
    periodSeconds: 20

service:
  type: ClusterIP
  backendPort: 8001
  frontendPort: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: kaeos.example.com
  tls:
    enabled: false
    secretName: kaeos-tls
  # Frontend at /, API at /api and /ws (both hit the backend).
  apiPaths: ["/api", "/ws", "/health"]

# ── data services (managed, out of cluster) ──────────────────────────────────
externalDatabase:
  # App connects as the NON-OWNER role so Postgres RLS actually applies.
  appUrl: "postgresql+asyncpg://kaeos_app:CHANGE_ME@postgres:5432/kaeos"
  # Owner URL: migrations + seeders only (bypasses RLS by design).
  ownerUrl: "postgresql+asyncpg://kaeos:CHANGE_ME@postgres:5432/kaeos"

externalRedis:
  url: "redis://redis:6379/0"

# ── secrets ──────────────────────────────────────────────────────────────────
# Provided here for convenience; in production prefer an existing Secret
# (set secrets.existingSecret) fed by a secrets manager / External Secrets.
secrets:
  existingSecret: ""        # if set, all keys are read from it instead of below
  SECRET_KEY: "CHANGE_ME_32_BYTES_MINIMUM_SECRET"
  ADMIN_EMAIL: "admin@kaeos.ai"
  ADMIN_PASSWORD: "CHANGE_ME"
  ADMIN_SECRET: "CHANGE_ME_ADMIN_BOOTSTRAP_SECRET"
  # Optional: PUBLIC_BASE_URL for OIDC/SAML redirect + ACS URLs.
  PUBLIC_BASE_URL: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities: { drop: ["ALL"] }

nodeSelector: {}
tolerations: []
affinity: {}
