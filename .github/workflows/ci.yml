name: KAEOS Enterprise CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install ruff
      run: pip install ruff==0.15.8
    - name: Ruff (bug-catching rules — see backend/ruff.toml)
      run: |
        cd backend
        ruff check .

  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run unit tests
      env:
        SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
        DEV_MODE: "true"
        ENVIRONMENT: "ci"
      run: |
        cd backend
        # The e2e suite needs a live backend on :8001 plus a local Ollama, so it
        # cannot run here — it skips itself via the `client` fixture rather than
        # failing, which would make CI green while testing nothing. Run it
        # against a real stack: see README "E2E Test Suite".
        #
        # -n auto parallelizes across cores (~2.4x). Safe here: this lane is
        # per-process in-memory SQLite, so every xdist worker is fully isolated.
        # NEVER add -n auto to the e2e lane below — it shares one live backend.
        #
        # Coverage floor: measured at 60% on this lane; the gate sits at 58
        # (measured-minus-2) so coverage can only trend up. pytest-cov combines
        # the per-worker data across xdist workers automatically.
        pytest tests/ --ignore=tests/e2e -n auto \
          --cov=app --cov-report=term-missing --cov-fail-under=58

  backend-e2e-mock:
    # Gate/pipeline logic against a LIVE backend with a deterministic fake
    # LLM (KAEOS_FAKE_LLM=1) - no Ollama, no cloud keys. Runs against real
    # PostgreSQL + pgvector + Redis (the production data stack) so dialect-only
    # bugs are caught in CI - e.g. NUMERIC-returns-Decimal issues that SQLite
    # silently tolerates. The full-fidelity e2e run with a real local model
    # stays a pre-release manual step (see README "E2E Test Suite").
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kaeos
          POSTGRES_PASSWORD: kaeos_ci
          POSTGRES_DB: kaeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaeos"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Prove migrations on Postgres (clean DB - forward chain + enum labels)
      # Runs the FULL alembic chain from an EMPTY Postgres database (a dedicated
      # kaeos_migrate DB, independent of the seed/e2e flow below which uses
      # create_all). This is the validation whose absence let native-enum / RLS /
      # pgvector / boolean DDL ship unvalidated (the class that broke prod before).
      # check_enum_labels then asserts every model enum member exists in its
      # native PG type (adding a member without ALTER TYPE would reject INSERTs).
      env:
        SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
        DATABASE_URL: "postgresql+asyncpg://kaeos:kaeos_ci@localhost:5432/kaeos_migrate"
        DATABASE_URL_SYNC: "postgresql+psycopg2://kaeos:kaeos_ci@localhost:5432/kaeos_migrate"
      run: |
        cd backend
        python - <<'PY'
        import psycopg2
        c = psycopg2.connect(host="localhost", port=5432, user="kaeos",
                             password="kaeos_ci", dbname="kaeos")
        c.autocommit = True
        cur = c.cursor()
        cur.execute("DROP DATABASE IF EXISTS kaeos_migrate")
        cur.execute("CREATE DATABASE kaeos_migrate")
        c.close()
        print("created clean kaeos_migrate")
        PY
        python -m scripts.check_migration_drift
        python -m scripts.check_enum_labels
    - name: Boot backend + seed + run non-Ollama e2e (on Postgres+pgvector)
      env:
        SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
        ADMIN_SECRET: "ci-admin-secret-do-not-use-in-production"
        DEV_MODE: "true"
        ENVIRONMENT: "ci"
        KAEOS_FAKE_LLM: "1"
        # App connects as the non-owner kaeos_app role (created by init_db via the
        # owner URL) so RLS actually applies - the same posture as production.
        DATABASE_URL: "postgresql+asyncpg://kaeos_app:kaeos_app_ci@localhost:5432/kaeos"
        DATABASE_URL_SYNC: "postgresql+psycopg2://kaeos:kaeos_ci@localhost:5432/kaeos"
        KAEOS_OWNER_DB_URL: "postgresql+asyncpg://kaeos:kaeos_ci@localhost:5432/kaeos"
        KAEOS_APP_DB_PASSWORD: "kaeos_app_ci"
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        cd backend
        python -m uvicorn app.main:app --port 8001 --log-level warning &
        for i in $(seq 1 30); do
          curl -sf http://localhost:8001/health > /dev/null && break
          sleep 2
        done
        python scripts/seed_master.py
        # Tenant-isolation gates, run on the freshly seeded database (before the
        # e2e suite mutates it). Both reuse this step's env — no extra setup.
        #
        # verify_rls must run as the APP role (the DATABASE_URL above): an owner
        # bypasses RLS, and the script self-skips with exit 0 when it detects it
        # owns the tables, so the non-owner role is what makes this check real
        # rather than decorative.
        #
        # check_tenant_integrity is the exact opposite and must run as the OWNER.
        # As the app role it is itself subject to RLS, and a script carries no
        # request tenant context, so all 245 tenant-scoped tables read back EMPTY
        # and it reports "no orphaned tenant_ids" without having seen a single
        # row — green, and proving nothing. Verified by planting one orphan row:
        # the owner run exits 1, the app-role run still exits 0. seed_master.py
        # uses MaintenanceSessionLocal for this same reason.
        python scripts/verify_rls.py
        DATABASE_URL="$KAEOS_OWNER_DB_URL" python -m scripts.check_tenant_integrity --strict
        pytest tests/e2e -m "not ollama" -q --tb=short

  equivalence:
    # Differential equivalence harnesses. They load the PRE-refactor modules
    # (extracted from the pinned refs below) as standalone modules, run them and
    # today's consolidated replacements over the same input matrix with the
    # boundary calls stubbed, and compare the captured payloads exactly — the
    # harnesses that proved the consolidations safe in the first place. Pinning
    # them here is what keeps those consolidations proven instead of merely
    # once-proven: ~5400 input combinations plus a row-for-row seed comparison,
    # about 90s total, no database or service container needed.
    #
    # If a behaviour change is INTENTIONAL, move the pinned ref forward in the
    # same commit that makes it. That is the point: the ref bump is a reviewable
    # admission that department behaviour changed, rather than a silent drift.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # `git show <pre-refactor ref>` needs real history; the default depth-1
        # checkout cannot reach it.
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Gate / router / seed equivalence vs pre-refactor originals
      env:
        SECRET_KEY: "ci-test-secret-key-do-not-use-in-production"
      run: |
        cd backend
        # Pinned pre-refactor refs (the ^ parent is the last commit that still
        # had the clones):
        #   e40bffd — ten cloned agents/gated_runner.py -> app/agents/department_gate.py
        #   97f7889 — cloned api/v1/router.py + seed.py -> app/core/{department_endpoints,domain_seed}.py
        for r in e40bffd 97f7889; do
          git cat-file -e "$r^{commit}" 2>/dev/null || {
            echo "::error::pinned pre-refactor ref $r is unreachable (rebased or squash-merged away). Re-pin it in .github/workflows/ci.yml."
            exit 1
          }
        done
        mkdir -p /tmp/old_gated /tmp/old_routers /tmp/old_seeds
        for d in engineering finance healthcare hr legal lending operations procurement sales support; do
          git show e40bffd^:backend/app/$d/agents/gated_runner.py > /tmp/old_gated/$d.py
          git show 97f7889^:backend/app/$d/api/v1/router.py       > /tmp/old_routers/$d.py
          git show 97f7889^:backend/app/$d/seed.py                > /tmp/old_seeds/$d.py
        done
        python scripts/diff_refactor_equivalence.py /tmp/old_gated
        python scripts/diff_router_equivalence.py /tmp/old_routers
        python scripts/diff_seed_equivalence.py /tmp/old_seeds

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: "22"
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: Lint and Build
      run: |
        cd frontend
        npm run lint
        npm run build
    - name: Unit tests (Vitest)
      run: |
        cd frontend
        npm test

  security-scan:
    # Dependency + static-analysis security scanning.
    # bandit (our own code) is BLOCKING at medium+ severity — a new medium/high
    # finding fails the build. Dependency advisories (pip-audit / npm audit) stay
    # advisory: they surface upstream transitive CVEs that are often unfixable
    # without a major bump, so they are triaged separately rather than blocking
    # every unrelated merge.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install scanners
      run: pip install pip-audit bandit
    - name: pip-audit (known CVEs in backend dependencies)
      continue-on-error: true
      run: |
        cd backend
        pip-audit -r requirements.txt
    - name: bandit (Python static analysis, medium+ severity — BLOCKING)
      run: |
        cd backend
        bandit -r app -ll
    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: "22"
    - name: npm audit (frontend dependencies, high+ severity)
      continue-on-error: true
      run: |
        cd frontend
        npm audit --audit-level=high

  sbom:
    # CycloneDX Software Bill of Materials for both dependency trees, published
    # as a build artifact so every green build has a downloadable, machine-
    # readable inventory (supply-chain provenance / vuln correlation).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Backend SBOM (CycloneDX, from requirements.txt)
      run: |
        pip install cyclonedx-bom
        cd backend
        cyclonedx-py requirements requirements.txt --of JSON -o ../sbom-backend.json
    - name: Frontend SBOM (CycloneDX, Syft)
      # Syft reads frontend/package-lock.json directly. Native `npm sbom`
      # (and cyclonedx-npm) shell out to `npm ls`, which fails ESBOMPROBLEMS on
      # this tree's optional platform-binary version skews (lightningcss) even
      # though `npm ci` and the build are clean; Syft has no such dependency.
      uses: anchore/sbom-action@v0
      with:
        path: ./frontend
        format: cyclonedx-json
        output-file: sbom-frontend.json
        upload-artifact: false
    - name: Upload SBOMs
      uses: actions/upload-artifact@v4
      with:
        name: sbom-cyclonedx
        path: |
          sbom-backend.json
          sbom-frontend.json
