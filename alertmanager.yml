# KAEOS Alertmanager config.
# Default: everything routes to the "null" receiver, so an unconfigured stack
# never crashes or spams - alerts are still visible in the Alertmanager UI
# (http://localhost:9093) and in Prometheus. To actually get paged, uncomment
# ONE of the receivers below, fill in your values, and point route.receiver
# at it. Alertmanager does not expand environment variables in this file, so
# the credentials go here (keep a production copy of this file out of git).

route:
  receiver: "null"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Example: page on critical, mail on warning.
  # routes:
  #   - receiver: slack
  #     matchers: ['severity="critical"']
  #   - receiver: email
  #     matchers: ['severity="warning"']

receivers:
  - name: "null"

