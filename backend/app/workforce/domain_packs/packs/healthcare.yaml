name: "Healthcare & Clinical Operations"
slug: "healthcare"
description: "Healthcare department covering PHI disclosure governance, patient authorization, Safe Harbor de-identification, and 42 CFR Part 2 substance-use records."
long_description: "The KAEOS Healthcare Domain Pack provides an autonomous, compliance-first clinical operations department that enforces the HIPAA Privacy Rule and 42 CFR Part 2 on every protected-health-information disclosure before it leaves the building."
icon: "heart-pulse"
category: "healthcare"
industry_verticals: ["healthcare", "life_sciences", "payers", "providers"]
version: "1.0.0"
author: "KAEOS"

required_integrations:
  - category: "ehr"
    examples: ["epic", "cerner", "athenahealth"]
    data_provided: ["patient_records", "encounters", "diagnosis_codes"]
  - category: "claims"
    examples: ["change_healthcare", "availity"]
    data_provided: ["claims", "member_eligibility", "remittances"]

capabilities:
  - id: "encounter_intake"
    name: "Encounter Intake & Triage"
    description: "Triage a patient encounter for urgency and completeness before clinical work begins."
    icon: "clipboard-list"
    agents: ["intake_agent"]
    processes: ["encounter_triage"]
    compliance: []

  - id: "medical_coding"
    name: "Medical Coding"
    description: "Suggest ICD-10 / CPT codes for an encounter for a human coder to review (never auto-finalized)."
    icon: "hash"
    agents: ["coding_agent"]
    processes: ["coding_suggestion"]
    compliance: ["HIPAA_MINIMUM_NECESSARY"]

  - id: "phi_disclosure_governance"
    name: "PHI Disclosure Governance"
    description: "Enforce minimum-necessary scope, patient authorization, Safe Harbor de-identification, and 42 CFR Part 2 consent on every PHI disclosure before release."
    icon: "shield-check"
    agents: ["phi_guard_agent"]
    processes: ["phi_disclosure_review"]
    compliance: ["HIPAA_MINIMUM_NECESSARY", "HIPAA_AUTHORIZATION", "HIPAA_DEIDENTIFICATION", "PART2"]

  - id: "prior_authorization"
    name: "Prior Authorization"
    description: "Assemble a payer prior-authorization request for human review and submission."
    icon: "file-check"
    agents: ["prior_auth_agent"]
    processes: ["prior_auth_prep"]
    compliance: ["HIPAA_MINIMUM_NECESSARY"]

agent_definitions:
  - name: "IntakeAgent"
    type: "intake_agent"
    capability: "encounter_intake"
    description: "Triages encounters for urgency and completeness."
    persona: "You are the KAEOS Healthcare Intake Agent. You triage encounters for urgency and completeness before clinical work begins."

  - name: "CodingAgent"
    type: "coding_agent"
    capability: "medical_coding"
    description: "Suggests ICD-10 / CPT codes for a human coder to review."
    persona: "You are the KAEOS Medical Coding Agent. You suggest ICD-10 and CPT codes from an encounter's documented reason. You never finalize a claim; a certified human coder reviews every suggestion."

  - name: "PHIGuardAgent"
    type: "phi_guard_agent"
    capability: "phi_disclosure_governance"
    description: "Reviews PHI disclosures against the HIPAA minimum-necessary, authorization, de-identification and 42 CFR Part 2 checkers as real gates."
    persona: "You are the KAEOS PHI Governance Agent. You ensure every disclosure is limited to the minimum necessary fields and backed by a valid patient authorization or specific Part 2 consent when required."

  - name: "PriorAuthAgent"
    type: "prior_auth_agent"
    capability: "prior_authorization"
    description: "Prepares payer prior-authorization requests for human submission."
    persona: "You are the KAEOS Prior Authorization Agent. You assemble the clinical justification a payer needs to authorize a procedure. A human reviews and submits; you never file with a payer directly."

process_definitions:
  - id: "encounter_triage"
    name: "Encounter Triage"
    capability: "encounter_intake"
    sla_hours: 2
    steps:
      - id: "triage_encounter"
        type: "AGENT_ACTION"
        agent: "intake_agent"
        method: "triage_encounter"

  - id: "coding_suggestion"
    name: "Coding Suggestion"
    capability: "medical_coding"
    sla_hours: 8
    steps:
      - id: "suggest_codes"
        type: "AGENT_ACTION"
        agent: "coding_agent"
        method: "suggest_codes"

  - id: "phi_disclosure_review"
    name: "PHI Disclosure Review"
    capability: "phi_disclosure_governance"
    sla_hours: 4
    steps:
      - id: "review_disclosure"
        type: "AGENT_ACTION"
        agent: "phi_guard_agent"
        method: "review_disclosure"

  - id: "prior_auth_prep"
    name: "Prior Authorization Prep"
    capability: "prior_authorization"
    sla_hours: 8
    steps:
      - id: "prepare_prior_auth"
        type: "AGENT_ACTION"
        agent: "prior_auth_agent"
        method: "prepare_prior_auth"

knowledge_templates:
  - "hipaa_privacy_policy"
  - "minimum_necessary_matrix"
  - "authorization_form_library"
  - "part2_consent_manual"

deployment_config:
  min_agents: 2
  max_agents: 8
  default_confidence_floor: 0.95
  requires_hitl: true

compliance_frameworks: ["HIPAA_MINIMUM_NECESSARY", "HIPAA_AUTHORIZATION", "HIPAA_DEIDENTIFICATION", "PART2"]
