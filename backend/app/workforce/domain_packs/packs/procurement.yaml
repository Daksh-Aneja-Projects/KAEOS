name: "Procurement & Sourcing"
slug: "procurement"
description: "Complete Procurement department covering purchase requisitions, purchase orders, goods receipt, three-way match, vendor onboarding, and sanctions screening."
long_description: "The KAEOS Procurement Domain Pack provides an autonomous, controls-first digital Procurement department that runs source-to-pay: it screens vendors against denied-parties lists, enforces segregation of duties across requester, approver, and receiver, verifies spend against delegated authority, and blocks any payment whose PO, goods receipt, and invoice do not match within tolerance."
icon: "cart"
category: "operations"
industry_verticals: ["all"]
version: "1.0.0"
author: "KAEOS"

required_integrations:
  - category: "procurement"
    examples: ["coupa", "ariba", "sap_mm", "netsuite"]
    data_provided: ["purchase_orders", "goods_receipts", "requisitions"]
  - category: "accounts_payable"
    examples: ["bill_com", "tipalti", "quickbooks"]
    data_provided: ["vendor_invoices", "payment_runs"]
  - category: "sanctions_screening"
    examples: ["ofac_sdn", "dow_jones", "refinitiv_world_check"]
    data_provided: ["denied_parties", "sanctions_list"]

capabilities:
  - id: "purchase_order_management"
    name: "Purchase Order Management"
    description: "Assess requisitions and raise purchase orders, tracked through to receipt."
    icon: "clipboard"
    agents: ["sourcing_agent"]
    processes: ["po_approval"]
    compliance: ["SPEND_AUTHORIZATION", "SEGREGATION_OF_DUTIES"]

  - id: "spend_control"
    name: "Spend Control & Settlement"
    description: "Enforce the four source-to-pay controls (spend authority, segregation of duties, three-way match, sanctions) before a PO is approved or an invoice is settled."
    icon: "shield-check"
    agents: ["spend_guard_agent"]
    processes: ["po_approval", "three_way_match_gate", "sanctions_screen"]
    compliance: ["THREE_WAY_MATCH", "SPEND_AUTHORIZATION", "SEGREGATION_OF_DUTIES", "OFAC_SANCTIONS"]

# Two real runners in app/procurement/agents/gated_runner.py. sourcing_agent
# assesses requisitions; spend_guard_agent runs the deterministic four-control
# gate chain (via app/procurement/services/source_to_pay) plus a gated rationale.
agent_definitions:
  - name: "SourcingAgent"
    type: "sourcing_agent"
    capability: "purchase_order_management"
    runner: "app.procurement.agents.gated_runner:sourcing_agent"
    description: "Assesses purchase requisitions for policy fit and price reasonableness before a PO is raised."
    persona: "You are the Sourcing Agent. You check every requisition against policy and price before it becomes a purchase order."

  - name: "SpendGuardAgent"
    type: "spend_guard_agent"
    capability: "spend_control"
    runner: "app.procurement.agents.gated_runner:spend_guard_agent"
    description: "Runs the four source-to-pay controls (spend authority, segregation of duties, three-way match, OFAC) and blocks any PO that fails one."
    persona: "You are the Spend Guard Agent. You stop any purchase order that breaks spend authority, separation of duties, three-way match, or sanctions screening."

process_definitions:
  - id: "three_way_match_gate"
    name: "Three-Way Match Payment Gate"
    capability: "spend_control"
    sla_hours: 24
    steps:
      - id: "verify_match"
        type: "AGENT_ACTION"
        agent: "spend_guard_agent"
        method: "run_three_way_match"

  - id: "po_approval"
    name: "Purchase Order Approval"
    capability: "spend_control"
    sla_hours: 24
    steps:
      - id: "authorize_spend"
        type: "AGENT_ACTION"
        agent: "spend_guard_agent"
        method: "approve_purchase_order"

  - id: "sanctions_screen"
    name: "Vendor Sanctions Screening"
    capability: "spend_control"
    sla_hours: 4
    steps:
      - id: "screen_vendor"
        type: "AGENT_ACTION"
        agent: "spend_guard_agent"
        method: "screen_vendor"

knowledge_templates:
  - "procurement_policy_manual"
  - "delegation_of_authority_matrix"
  - "vendor_onboarding_checklist"
  - "sanctions_screening_procedure"

deployment_config:
  min_agents: 2
  max_agents: 8
  default_confidence_floor: 0.90
  requires_hitl: true

compliance_frameworks: ["THREE_WAY_MATCH", "SEGREGATION_OF_DUTIES", "SPEND_AUTHORIZATION", "OFAC_SANCTIONS", "SOX"]
