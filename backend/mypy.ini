; KAEOS mypy lane — scoped, not a whole-tree gate.
;
; Covers the highest-value modules where a type error is a money or
; security bug: finance services (Decimal math, 3-way match, GL, payments),
; the provenance hash-chain, and the compliance checkers. Run it with:
;     mypy --config-file mypy.ini
; The `files` list below is the scope; do not widen it casually — the point
; is a lane that stays green, not a boil-the-ocean gate over dynamic
; SQLAlchemy model code.
[mypy]
python_version = 3.11
; The SQLAlchemy plugin resolves Column[str] descriptors to the mapped python
; type on instances, so `record.tenant_id = "acme"` stops reading as a bogus
; "str vs Column[str]" mismatch. Without it every ORM assignment is noise.
plugins = sqlalchemy.ext.mypy.plugin
; Report errors only in the scoped `files` below; imported modules are loaded
; for their types but their own errors stay out of this lane.
follow_imports = silent
explicit_package_bases = True
namespace_packages = True
; Third-party libs without stubs (sqlalchemy plugins, jwt, redis, etc.) are
; not our concern in this lane.
ignore_missing_imports = True
; Sensible strictness: catch real mistakes (untyped call sites, bad optionals,
; unreachable code) without demanding a full annotation of every dynamic path.
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
warn_unreachable = True
files =
    app/finance/services,
    app/services/provenance.py,
    app/compliance

; SQLAlchemy declarative models are almost all dynamic attribute assignment;
; type-checking them yields noise, not bugs. The models are exercised by the
; test suite instead.
[mypy-app.finance.models.*]
ignore_errors = True
